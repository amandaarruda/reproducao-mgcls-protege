[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducao-mgcls-protege"
version = "0.1.0"
description = "Código da reprodução do Astronomaly Protege no MGCLS"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "pyarrow>=15,<20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mgcls-protege = "mgcls_protege.cli:main"

[tool.setuptools.packages.find]
include = ["mgcls_protege*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
